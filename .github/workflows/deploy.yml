name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate config.js with proxy URL
        run: |
          printf 'const TELEGRAM_CONFIG = {\n    PROXY_URL: "https://script.google.com/macros/s/AKfycbzKlsJ727ovbJK66YWbA_UUql2kSfPg-LPQKWcaXHgGNxC_vUk5EhO7KKEkDePHhhd3BA/exec"\n};\n' > config.js

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
